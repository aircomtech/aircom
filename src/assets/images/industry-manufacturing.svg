<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0D1B3E"/>
        <stop offset="100%" stop-color="#1E3A8A"/>
      </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#bg)"/>
    <g opacity="0.16" stroke="#7DD3FC" stroke-width="1">
      <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
      <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
      <line x1="160" y1="0" x2="160" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/>
      <line x1="480" y1="0" x2="480" y2="500"/><line x1="640" y1="0" x2="640" y2="500"/>
    </g>
    
      <!-- Smart factory silhouettes & robotic arm -->
      <polygon points="80,410 80,235 190,175 190,235 300,175 300,235 410,175 410,410" fill="#102A63"/>
      <rect x="440" y="340" width="250" height="70" rx="10" fill="#1E293B"/>
      <!-- Robotic arm -->
      <circle cx="540" cy="340" r="24" fill="#F59E0B"/>
      <line x1="540" y1="340" x2="610" y2="230" stroke="#38BDF8" stroke-width="18" stroke-linecap="round"/>
      <circle cx="610" cy="230" r="18" fill="#F59E0B"/>
      <line x1="610" y1="230" x2="495" y2="175" stroke="#60A5FA" stroke-width="14" stroke-linecap="round"/>
      <circle cx="495" cy="175" r="14" fill="#0BA8EA"/>
      <!-- Factory glowing windows -->
      <rect x="115" y="275" width="45" height="35" rx="4" fill="#38BDF8" opacity="0.6"/>
      <rect x="180" y="275" width="45" height="35" rx="4" fill="#38BDF8" opacity="0.6"/>
      <rect x="245" y="275" width="45" height="35" rx="4" fill="#F59E0B" opacity="0.65"/>
    
  </svg>
