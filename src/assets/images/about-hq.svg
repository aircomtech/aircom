<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="glass1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B3E"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0BA8EA"/>
    </linearGradient>
    <linearGradient id="glass2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102A63"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="sunReflect" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0BA8EA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="580" fill="url(#sky)"/>
  <!-- Soft clouds -->
  <ellipse cx="160" cy="110" rx="140" ry="38" fill="#FFFFFF" opacity="0.45"/>
  <ellipse cx="730" cy="88" rx="170" ry="42" fill="#FFFFFF" opacity="0.38"/>
  <!-- City backdrop silhouettes -->
  <rect x="650" y="210" width="90" height="330" fill="#1E3A8A" opacity="0.28"/>
  <rect x="755" y="260" width="85" height="280" fill="#102A63" opacity="0.22"/>
  <rect x="40" y="270" width="95" height="270" fill="#1E3A8A" opacity="0.22"/>
  <!-- Left glass wing -->
  <polygon points="155,215 415,130 415,525 155,525" fill="url(#glass1)"/>
  <!-- Right glass facade -->
  <polygon points="415,130 745,210 745,525 415,525" fill="url(#glass2)"/>
  <!-- Diagonal reflection -->
  <polygon points="175,210 415,135 415,360 175,450" fill="url(#sunReflect)"/>
  <!-- Glass grid mullions left -->
  <g stroke="#93C5FD" stroke-opacity="0.38" stroke-width="2">
    <line x1="205" y1="198" x2="205" y2="525"/>
    <line x1="255" y1="182" x2="255" y2="525"/>
    <line x1="310" y1="165" x2="310" y2="525"/>
    <line x1="362" y1="147" x2="362" y2="525"/>
    <line x1="155" y1="265" x2="415" y2="195"/>
    <line x1="155" y1="320" x2="415" y2="262"/>
    <line x1="155" y1="375" x2="415" y2="330"/>
    <line x1="155" y1="430" x2="415" y2="398"/>
  </g>
  <!-- Glass grid mullions right -->
  <g stroke="#BAE6FD" stroke-opacity="0.32" stroke-width="2">
    <line x1="475" y1="145" x2="475" y2="525"/>
    <line x1="540" y1="160" x2="540" y2="525"/>
    <line x1="605" y1="176" x2="605" y2="525"/>
    <line x1="675" y1="193" x2="675" y2="525"/>
    <line x1="415" y1="195" x2="745" y2="262"/>
    <line x1="415" y1="262" x2="745" y2="318"/>
    <line x1="415" y1="330" x2="745" y2="375"/>
    <line x1="415" y1="398" x2="745" y2="432"/>
  </g>
  <!-- Glowing corporate windows -->
  <polygon points="480,210 535,222 535,270 480,260" fill="#38BDF8" opacity="0.35"/>
  <polygon points="545,286 600,296 600,342 545,334" fill="#F59E0B" opacity="0.28"/>
  <polygon points="260,300 305,288 305,338 260,348" fill="#7DD3FC" opacity="0.32"/>
  <!-- Architectural canopy entrance -->
  <polygon points="335,475 510,475 530,492 315,492" fill="#0D1B3E"/>
  <rect x="355" y="492" width="135" height="33" fill="#0BA8EA" opacity="0.55"/>
  <!-- Landscaped greenery foreground -->
  <rect x="0" y="518" width="900" height="62" fill="#0F172A"/>
  <circle cx="95" cy="495" r="52" fill="#15803D"/>
  <circle cx="145" cy="505" r="42" fill="#16A34A"/>
  <circle cx="790" cy="498" r="48" fill="#15803D"/>
  <circle cx="845" cy="508" r="38" fill="#22C55E"/>
  <!-- Brand Orange Accent Strip matching design reference -->
  <polygon points="0,330 68,265 68,365 0,430" fill="#F59E0B"/>
</svg>
